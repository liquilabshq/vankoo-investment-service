name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build-test:
    name: Build, unit and acceptance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build and test (JUnit 5 + Cucumber)
        run: mvn -B verify

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Resultados de pruebas (Cucumber y JUnit)
          path: target/surefire-reports/*.xml
          reporter: java-junit

      - name: Upload Cucumber and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-and-test-reports
          path: |
            target/cucumber-reports/
            target/surefire-reports/
          retention-days: 14
